<style>
@media screen{
#app.ops-shell header.top.gto-integrated-header:has(.gto-shared-toolbar){padding:0;gap:0}
#app.ops-shell header.top:has(.gto-shared-toolbar .gto-toolbar-account)>.user,
#app.ops-shell header.top:has(.gto-shared-toolbar .gto-toolbar-quick .gto-portal-access)>.ops-menu-link{display:none}
#app .gto-shared-toolbar{justify-content:flex-start;gap:16px}
#app .gto-toolbar-quick{margin-inline-end:auto}
#app .gto-toolbar-quick :is(button,a){background:#fff;color:#06612e!important;border:1px solid #cbe1d3;border-radius:9px;padding:8px 12px}
#app .ops-sidebar{background:#f7faf8;color:#203d2b;border-right:1px solid #d8e6dc}
#app .ops-module strong,#app .ops-module small,#app .ops-nav-label,#app .ops-sidebar-foot{color:#365641}
#app .ops-navigation a{color:#254a33!important}
#app .ops-navigation a:is(:hover,.active){background:#dcefe2;color:#064925!important}
#app.ops-shell .ops-workspace>main{background:#f6f8f7}
#app .grid-info{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1200px){#app .grid-info{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){#app .grid-info{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:460px){#app .grid-info{grid-template-columns:1fr}}
}
</style>
<style>@media screen{
#app.ops-shell:has(.ot-sheet) .gto-shared-toolbar{background:#054c2a;border-radius:12px;padding:10px 18px}
#app.ops-shell:has(.ot-sheet) header.top{background:white;padding:6px}
#app.ops-shell:has(.ot-sheet) .gto-toolbar-quick :is(button,a),#app.ops-shell:has(.ot-sheet) .gto-toolbar-menu>summary{background:#075932;color:white!important;border:1px solid #c3d9ca;border-radius:7px}
#app.ops-shell .ops-workspace>.ot-sheet{max-width:none;box-sizing:border-box;margin:0;padding:16px clamp(14px,2vw,34px);background:white}
#app .ot-sheet .back{font-size:12px;margin-bottom:5px}
#app .ot-sheet .detail-head{margin:0 0 12px;align-items:center}
#app .ot-sheet .detail-head h1{font-size:clamp(22px,2vw,32px);color:#12462c;line-height:1.12;margin:3px 0}
#app .ot-block{background:white;border:1px solid #bccfc1;border-radius:12px;overflow:hidden;margin-bottom:12px}
#app .ot-heading{margin:0;padding:8px 15px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #dae6dd;font-size:17px;color:#173f2a}
#app .ot-sheet .chain{display:flex;flex-wrap:nowrap;align-items:stretch;overflow:auto;margin:0;padding:12px;gap:5px}
#app .ot-sheet .chain .step{flex:1 0 95px;min-width:0;padding:9px;border:1px solid #cbdcd0;border-radius:8px;background:#f9fbfa;overflow-wrap:anywhere}
#app .ot-sheet .chain .done{background:#eaf6ee;border-color:#87c19a}
#app .ot-sheet .chain .arr{align-self:center}
#app .ot-sheet .step b,#app .ot-sheet .grid-info .k{text-transform:none;font-size:13px;letter-spacing:0;color:#284a35}
#app .ot-sheet .grid-info{margin:0;border:0;border-radius:0}
#app .ot-sheet .grid-info>div{padding:9px 12px}
#app .ot-sheet .grid-info .k{display:flex;align-items:center;gap:6px}
#app .ot-sheet .grid-info .v{margin-left:24px}
#app .ot-sheet .tabs{background:white;border:0;border-bottom:1px solid #c9dbcf;border-radius:0}
#app .ot-sheet .tabs button.on{box-shadow:none;border-radius:0;background:white;border-bottom:3px solid #077a3a}
#app .ot-sheet th{background:#06612e;color:white;text-transform:none;font-size:12px}
#app .ot-sheet :is(td,th){padding:8px 10px}
#app .ot-sym{display:inline-block;width:18px;height:18px;flex:none;vertical-align:middle;color:#077a3a}
#app .step>.ot-sym{display:block;margin-bottom:5px}
}</style>
